[project]
name = "lmconf"
authors = [{ name = "huaxlin", email = "huaxlin33@gmail.com" }]
dynamic = [ "version" ]
description = 'Support for multiple LLM configurations in one application settings'
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
]

[project.optional-dependencies]
demo = [
  "pydantic-settings",
]
# integrations
langchain = [
  "langchain>=0.2,<0.3",
  "langchain-community",
  "langchain-openai",
]
# LLMs providers
tongyi = [
  "dashscope>=1.14.0"
]

test = [
  "pydantic-settings",
  "pytest",
  "requests-mock",
  "pytest-httpx"
]
dev = [
  "black",
  "flake8",
  "isort",
  "mypy",
  "rich",
]

[project.urls]
Home = "https://github.com/huaxlin/lmconf"


[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lmconf/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lmconf"]
